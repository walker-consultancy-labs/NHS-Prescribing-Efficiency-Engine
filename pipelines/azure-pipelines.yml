# -------------------------------------------------------------------------
# Pipeline: NHS Prescribing Efficiency Engine - CI
# Objective: Automate validation and ingestion of NHSBSA Open Data
# -------------------------------------------------------------------------

# TRIGGER: Aligned to the left margin
trigger:
- main

# POOL: Aligned to the left margin
pool:
  vmImage: ubuntu-latest

# STAGES: Aligned to the left margin (not indented under pool)
stages:
- stage: Build_and_Initial_Test
  displayName: 'Build & Smoke Test'
  jobs: 
  - job: Environment_Verification
    displayName: 'Verify Engine Environment'
    steps:
    # The '|' symbol is mandatory for multi-line PowerShell scripts
    - pwsh: |
        Write-Host "Initialising NHS Prescribing Efficiency Engine..."
        Write-Host "Environment: $(Agent.OS)"
        Write-Host "Time (UTC): $(Get-Date -Format 'HH:mm:ss')"
      displayName: 'Print Engine Status'